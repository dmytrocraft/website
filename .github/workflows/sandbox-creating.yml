name: sandbox

on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROD_AWS_ACCOUNT_ID: ${{ vars.PROD_AWS_ACCOUNT_ID }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

permissions: {}

# Serialize sandbox provisioning per branch/PR without cancelling: aborting an
# in-flight AWS pipeline trigger mid-run is unsafe.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check-tokens:
    # Same-repo guard: fork PRs receive no OIDC id-token and no secrets, so the
    # prod-account role assumptions below can only run for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # OIDC only: these jobs assume AWS roles but never check out the repo or
      # call the GitHub API, so no contents/GITHUB_TOKEN scope is needed.
      id-token: write
    steps:
      - name: Validate AWS Region
        run: |
          if [ -z "${AWS_REGION}" ]; then
            echo "::error::AWS_REGION is not set"
            exit 1
          fi

      - name: Configure AWS Credentials (Test)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{vars.TEST_AWS_ACCOUNT_ID}}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Test Rotation
        id: determine_test_rotation
        run: |
          if ! SECRET_ID=$(aws secretsmanager list-secrets \
            --region "${AWS_REGION}" \
            --query "SecretList[?starts_with(Name, 'github-token-') && DeletionDate==null].Name | [0]" \
            --output text); then
            echo "::error::Failed to list secrets: ${SECRET_ID}"
            exit 1
          fi

          if [ -z "$SECRET_ID" ] || [ "$SECRET_ID" = "None" ]; then
            echo "Token doesn't exist in the test account."
          else
            # The secret JSON carries the GitHub token beside expires_at, so it is
            # piped straight into jq and never bound to a shell variable that a
            # later `set -x`, env dump or errored step could print (#375).
            # pipefail keeps a failed get-secret-value fatal, as the former
            # assignment was under the default `bash -e`.
            set -o pipefail
            EXPIRES_AT=$(aws secretsmanager get-secret-value \
              --secret-id "${SECRET_ID}" \
              --region "${AWS_REGION}" \
              --query SecretString \
              --output text | jq -r '.expires_at // empty')
            if [ -z "$EXPIRES_AT" ]; then
              echo "Token doesn't exist in the test account."
            else
              NOW=$(date -u +%s)
              EXPIRATION_TIME=$(date -d "$EXPIRES_AT" +%s 2>/dev/null)
              if [ "$NOW" -ge "$EXPIRATION_TIME" ]; then
                echo "Token has expired in the test account."
              else
                echo "Token exists in the test account."
              fi
            fi
          fi

      - name: Configure AWS Credentials (Prod)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{vars.PROD_AWS_ACCOUNT_ID}}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Prod Rotation
        id: determine_prod_rotation
        run: |
          if ! SECRET_ID=$(aws secretsmanager list-secrets \
            --region "${AWS_REGION}" \
            --query "SecretList[?starts_with(Name, 'github-token-') && DeletionDate==null].Name | [0]" \
            --output text); then
            echo "::error::Failed to list secrets: ${SECRET_ID}"
            exit 1
          fi

          if [ -z "$SECRET_ID" ] || [ "$SECRET_ID" = "None" ]; then
            echo "Token doesn't exist in the prod account."
          else
            # The secret JSON carries the GitHub token beside expires_at, so it is
            # piped straight into jq and never bound to a shell variable that a
            # later `set -x`, env dump or errored step could print (#375).
            # pipefail keeps a failed get-secret-value fatal, as the former
            # assignment was under the default `bash -e`.
            set -o pipefail
            EXPIRES_AT=$(aws secretsmanager get-secret-value \
              --secret-id "${SECRET_ID}" \
              --region "${AWS_REGION}" \
              --query SecretString \
              --output text | jq -r '.expires_at // empty')
            if [ -z "$EXPIRES_AT" ]; then
              echo "Token doesn't exist in the prod account."
            else
              NOW=$(date -u +%s)
              EXPIRATION_TIME=$(date -d "$EXPIRES_AT" +%s 2>/dev/null)
              if [ "$NOW" -ge "$EXPIRATION_TIME" ]; then
                echo "Token has expired in the prod account."
              else
                echo "Token exists in the prod account."
              fi
            fi
          fi

  deploy:
    # Same-repo guard: fork PRs receive no OIDC id-token, so the prod-account
    # sandbox-creation trigger can only run for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check-tokens]
    permissions:
      # OIDC only: assumes the sandbox-creation role but never checks out the
      # repo or calls the GitHub API, so no contents/GITHUB_TOKEN scope is needed.
      id-token: write
    steps:
      # PR_NUMBER comes straight from the pull_request event payload, so no
      # GitHub token or API round-trip is needed to discover it. This drops the
      # Secrets-Manager-token dependency that broke this job whenever the stored
      # token expired, and no longer writes that token to $GITHUB_ENV.
      - name: Validate environment variables
        run: |
          if [ -z "${AWS_REGION}" ]; then
            echo "::error::AWS_REGION is not set"
            exit 1
          fi
          if [ -z "${PROD_AWS_ACCOUNT_ID}" ]; then
            echo "::error::PROD_AWS_ACCOUNT_ID is not set"
            exit 1
          fi
          if [ -z "${BRANCH_NAME}" ]; then
            echo "::error::BRANCH_NAME is not set"
            exit 1
          fi
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "::error::PR_NUMBER is not set"
            exit 1
          fi

      - name: Configure AWS Credentials (Sandbox Creation Trigger Role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.PROD_AWS_ACCOUNT_ID }}:role/sandbox-creation-trigger-role
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Start Pipeline Execution
        run: |
          aws codepipeline start-pipeline-execution --name "sandbox-creation" \
            --variables \
            "name=BRANCH_NAME,value=${BRANCH_NAME}" \
            "name=PR_NUMBER,value=${PR_NUMBER}" \
            "name=IS_PULL_REQUEST,value=1"

  post-create-smoke:
    name: post-create smoke test
    needs: [deploy]
    # The sandbox origin has to be reachable to be probed. Until a maintainer sets
    # the SANDBOX_SITE_URL_TEMPLATE repository variable (Settings → Secrets and
    # variables → Actions → Variables) — a URL carrying `{pr}`, e.g.
    # `https://pr-{pr}.sandbox.example.com` — the job skips cleanly rather
    # than failing every PR. `needs: deploy` carries the same-repo guard forward:
    # a fork PR never creates a sandbox, so there is nothing here to probe.
    if: ${{ vars.SANDBOX_SITE_URL_TEMPLATE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Issue #363. The same negative-path contract the production deploy asserts,
      # run where it is cheap to be wrong: a sandbox is the only environment where
      # a regression in `scripts/cloudfront_routing.js` can be observed through a
      # real CloudFront distribution before it reaches production. `--expect-noindex`
      # is the one difference — a sandbox origin must not be indexable, and that
      # header comes from the infra repository's response-headers policy, so it
      # warns rather than blocking.
      - name: Smoke-test the sandbox negative path (404 shape, noindex)
        env:
          URL_TEMPLATE: ${{ vars.SANDBOX_SITE_URL_TEMPLATE }}
          # A sandbox is provisioned end-to-end by CodePipeline, so it is slower to
          # answer than a production deploy that only swaps objects behind an
          # existing distribution.
          SMOKE_ATTEMPTS: '40'
          SMOKE_DELAY: '15'
        run: |
          set -euo pipefail

          # `{pr}` is the only placeholder, and deliberately so. The sandbox hostname
          # is derived by the infra repository's CodePipeline from the BRANCH_NAME the
          # deploy job above passes through RAW, so this repository does not know the
          # branch -> hostname transform: any slug written here would be a guess, and a
          # guess that is wrong probes an origin the sandbox is not at. That fails the
          # PR on a healthy deployment, or — worse — passes against a different
          # sandbox. PR_NUMBER is passed to the same pipeline verbatim and is digits,
          # so substituting it is an exact reconstruction rather than an inference.
          case "$URL_TEMPLATE" in
            *'{branch}'*)
              echo "::error::SANDBOX_SITE_URL_TEMPLATE holds {branch}, which this workflow cannot resolve: the branch to hostname transform lives in the sandbox pipeline, not in this repository. Use {pr}."
              exit 1
              ;;
          esac

          # A template with no placeholder resolves to ONE fixed origin for every PR,
          # so a green result would certify somebody else's sandbox — or a stale one.
          # Refuse before probing rather than report a meaningless pass.
          case "$URL_TEMPLATE" in
            *'{pr}'*) ;;
            *)
              echo "::error::SANDBOX_SITE_URL_TEMPLATE must contain {pr}; a fixed origin would certify the wrong deployment"
              exit 1
              ;;
          esac

          url="${URL_TEMPLATE//\{pr\}/${PR_NUMBER}}"

          # `{pr}` is the only token substituted, so a brace surviving substitution is
          # a placeholder this job does not implement — `{host}`, or a mistyped `{pr`.
          # Probing that URL asks about an origin nobody deployed: the failure would be
          # reported as a broken sandbox rather than as a misconfigured variable.
          case "$url" in
            *'{'*|*'}'*)
              echo "::error::SANDBOX_SITE_URL_TEMPLATE left an unresolved placeholder in ${url}; {pr} is the only token this job substitutes"
              exit 1
              ;;
          esac

          echo "Probing sandbox origin: ${url}"
          ./scripts/ci/smoke-response-shape.sh "$url" --expect-noindex
