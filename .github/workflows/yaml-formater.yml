name: format yaml files

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yamlfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install yamlfmt
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/yamlfmt_0.21.0_Linux_x86_64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/google/yamlfmt/releases/download/v0.21.0/yamlfmt_0.21.0_Linux_x86_64.tar.gz
          echo "1f300d9257b232bb3b541d7fb1b0e6b3c121bcbab381c86cd38cb8722be8a566  $archive" \
            | sha256sum --check --strict --status
          mkdir --parents "$RUNNER_TEMP/yamlfmt"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/yamlfmt" yamlfmt
      - name: Check YAML formatting
        shell: bash
        run: |
          "$RUNNER_TEMP/yamlfmt/yamlfmt" -lint .
